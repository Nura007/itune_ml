[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appstore-ml-midterm"
version = "0.1.0"
description = "Reproducible App Store rating classification for existing apps"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "scipy==1.15.3",
  "scikit-learn==1.6.1", "joblib==1.4.2", "requests==2.32.4",
  "matplotlib==3.10.3", "python-pptx==1.0.2", "nbformat==5.10.4"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "nbclient==0.10.2", "ipykernel==6.29.5", "ruff==0.11.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
